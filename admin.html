```html
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>NorthEast News — Admin</title>


<style>

/* =========================
   BASIC
========================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    background: #f5f7fb;

    color: #111827;

    font-family: Arial, sans-serif;

}


/* =========================
   CONTAINER
========================= */

.admin-container {

    width: min(700px, 92%);

    margin: 70px auto;

}


.admin-card {

    background: white;

    border: 1px solid #dfe3ea;

    border-radius: 18px;

    padding: 50px;

    box-shadow:
        0 20px 60px
        rgba(16,24,40,0.08);

}


/* =========================
   HEADER
========================= */

.eyebrow {

    margin: 0 0 8px;

    color: #1d4ed8;

    font-size: 12px;

    letter-spacing: 2px;

    font-weight: bold;
}


h1 {

    font-size: 42px;

    margin: 0 0 8px;

}


.intro {

    color: #667085;

    margin-bottom: 30px;

}


/* =========================
   FORM
========================= */

form {

    display: grid;

    gap: 20px;

}


label {

    display: grid;

    gap: 8px;

    font-weight: bold;

    font-size: 14px;

}


input,
textarea {

    width: 100%;

    border: 1px solid #dfe3ea;

    border-radius: 10px;

    padding: 13px 14px;

    font: inherit;

    color: #111827;

    background: white;

}


input:focus,
textarea:focus {

    outline: 2px solid
        rgba(29,78,216,0.18);

    border-color: #1d4ed8;

}


textarea {

    min-height: 230px;

    resize: vertical;

}


/* =========================
   BUTTON
========================= */

button {

    border: none;

    border-radius: 10px;

    padding: 14px;

    background: #111827;

    color: white;

    font: inherit;

    font-weight: bold;

    cursor: pointer;

}


button:hover {

    background: #1d4ed8;

}


button:disabled {

    opacity: 0.6;

    cursor: wait;

}


/* =========================
   MESSAGE
========================= */

.message {

    min-height: 24px;

    margin: 0;

    color: #667085;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .admin-container {

        margin: 30px auto;

    }


    .admin-card {

        padding: 25px;

    }


    h1 {

        font-size: 34px;

    }

}

</style>

</head>


<body>


<!-- =========================
     ADMIN
========================= -->

<main class="admin-container">

    <section class="admin-card">


        <p class="eyebrow">
            NEWS ADMIN
        </p>


        <h1>
            Welcome
        </h1>


        <p class="intro">
            Publish a new report to the
            public news feed.
        </p>



        <form id="newsForm">


            <!-- DATE -->

            <label>

                Date

                <input
                    type="date"
                    id="reportDate"
                    required
                >

            </label>



            <!-- REPORTER -->

            <label>

                Report by

                <input
                    type="text"
                    id="reporter"
                    placeholder="Reporter name"
                    maxlength="100"
                    required
                >

            </label>



            <!-- PLACE -->

            <label>

                Place

                <input
                    type="text"
                    id="place"
                    placeholder="Place of report"
                    maxlength="150"
                    required
                >

            </label>



            <!-- CONTENT -->

            <label>

                Content

                <textarea
                    id="content"
                    placeholder="Write the news report..."
                    maxlength="10000"
                    required
                ></textarea>

            </label>



            <!-- BUTTON -->

            <button
                type="submit"
                id="submitBtn"
            >
                Submit Report
            </button>


            <p
                id="message"
                class="message"
            ></p>


        </form>


    </section>

</main>



<script>

/* =====================================
   SUPABASE CONFIG
===================================== */

const SUPABASE_URL =
    "https://YOUR-PROJECT.supabase.co";

const SUPABASE_ANON_KEY =
    "YOUR_SUPABASE_ANON_KEY";



/* =====================================
   ELEMENTS
===================================== */

const form =
    document.getElementById("newsForm");

const submitBtn =
    document.getElementById("submitBtn");

const message =
    document.getElementById("message");

const reportDate =
    document.getElementById("reportDate");



/* =====================================
   DEFAULT DATE
===================================== */

reportDate.value =
    new Date()
        .toISOString()
        .slice(0, 10);



/* =====================================
   SUBMIT
===================================== */

form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        /* =========================
           GET DATA
        ========================= */

        const data = {

            report_date:
                reportDate.value,

            reporter:
                document
                    .getElementById("reporter")
                    .value
                    .trim(),

            place:
                document
                    .getElementById("place")
                    .value
                    .trim(),

            content:
                document
                    .getElementById("content")
                    .value
                    .trim()

        };


        /* =========================
           VALIDATION
        ========================= */

        if (
            !data.report_date ||
            !data.reporter ||
            !data.place ||
            !data.content
        ) {

            message.textContent =
                "Please fill in all fields.";

            return;

        }



        /* =========================
           BUTTON
        ========================= */

        submitBtn.disabled = true;

        submitBtn.textContent =
            "Submitting...";

        message.textContent = "";



        /* =========================
           SEND TO SUPABASE
        ========================= */

        try {

            const response = await fetch(

                SUPABASE_URL +
                "/rest/v1/news",

                {

                    method: "POST",

                    headers: {

                        "apikey":
                            SUPABASE_ANON_KEY,

                        "Authorization":
                            "Bearer " +
                            SUPABASE_ANON_KEY,

                        "Content-Type":
                            "application/json",

                        "Prefer":
                            "return=minimal"

                    },


                    body:
                        JSON.stringify(data)

                }

            );


            /* =========================
               CHECK RESPONSE
            ========================= */

            if (!response.ok) {

                throw new Error(
                    await response.text()
                );

            }



            /* =========================
               SUCCESS
            ========================= */

            message.textContent =
                "Report published successfully.";


            form.reset();


            // Put today's date back

            reportDate.value =
                new Date()
                    .toISOString()
                    .slice(0, 10);


        } catch (error) {

            console.error(error);

            message.textContent =
                "Could not publish the report. " +
                "Check your Supabase RLS policy.";

        }



        /* =========================
           ENABLE BUTTON
        ========================= */

        submitBtn.disabled = false;

        submitBtn.textContent =
            "Submit Report";

    }
);

</script>


</body>
</html>
