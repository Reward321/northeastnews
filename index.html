<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NorthEast News</title>

<style>

/* =========================
   BASIC
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: #f7f8fa;
    color: #111827;
    line-height: 1.6;

    min-height: 100vh;

    display: flex;
    flex-direction: column;
}

a {
    text-decoration: none;
    color: inherit;
}


/* =========================
   NAVBAR
========================= */

.navbar {

    height: 70px;

    padding: 0 7%;

    display: flex;

    align-items: center;

    justify-content: space-between;

    background: rgba(255,255,255,0.96);

    border-bottom: 1px solid #e5e7eb;
}

.brand {

    display: flex;

    align-items: center;

    gap: 10px;

    font-weight: bold;

    font-size: 18px;
}

.logo {

    width: 38px;
    height: 38px;

    display: grid;

    place-items: center;

    background: #111827;

    color: white;

    border-radius: 10px;
}


/* =========================
   AUTH SECTION
========================= */

.auth-section {

    flex: 1;

    display: grid;

    place-items: center;

    padding: 80px 7%;

    background:
        radial-gradient(
            circle at 80% 20%,
            rgba(29,78,216,0.16),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #eef3ff,
            #f7f8fa 55%,
            #e9edf4
        );
}

.auth-container {

    width: 100%;

    max-width: 440px;

    text-align: center;
}


/* =========================
   HEADING
========================= */

.eyebrow {

    color: #1d4ed8;

    font-size: 12px;

    letter-spacing: 2px;

    font-weight: bold;

    margin-bottom: 12px;
}

.auth-container h1 {

    font-size: clamp(40px, 7vw, 60px);

    line-height: 1.05;

    letter-spacing: -2px;

    margin-bottom: 12px;
}

.description {

    color: #667085;

    margin-bottom: 35px;
}


/* =========================
   AUTH CARD
========================= */

.auth-card {

    background: white;

    border: 1px solid #e5e7eb;

    border-radius: 16px;

    padding: 30px;

    text-align: left;

    box-shadow:
        0 8px 30px rgba(16,24,40,0.06);
}


/* =========================
   TABS
========================= */

.auth-tabs {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 8px;

    margin-bottom: 25px;

    padding: 5px;

    background: #f2f4f7;

    border-radius: 10px;
}

.auth-tab {

    padding: 10px;

    border: none;

    border-radius: 7px;

    background: transparent;

    color: #667085;

    font-weight: bold;

    cursor: pointer;
}

.auth-tab.active {

    background: white;

    color: #111827;

    box-shadow:
        0 2px 6px rgba(16,24,40,0.08);
}


/* =========================
   FORM
========================= */

.form-group {

    margin-bottom: 20px;
}

.form-group label {

    display: block;

    margin-bottom: 7px;

    font-size: 14px;

    font-weight: bold;
}

.form-group input {

    width: 100%;

    padding: 13px 14px;

    border: 1px solid #d0d5dd;

    border-radius: 10px;

    background: white;

    color: #111827;

    font-size: 15px;

    outline: none;

    transition: border 0.2s;
}

.form-group input:focus {

    border-color: #1d4ed8;
}


/* =========================
   BUTTON
========================= */

.auth-btn {

    width: 100%;

    padding: 13px 22px;

    border: none;

    border-radius: 10px;

    background: #111827;

    color: white;

    font-weight: bold;

    font-size: 15px;

    cursor: pointer;
}

.auth-btn:hover {

    background: #1d4ed8;
}

.auth-btn:disabled {

    opacity: 0.6;

    cursor: not-allowed;
}


/* =========================
   STATUS
========================= */

.status {

    margin-top: 18px;

    text-align: center;

    font-size: 14px;

    color: #667085;
}

.status.error {

    color: #b42318;
}

.status.success {

    color: #067647;
}


/* =========================
   FOOTER
========================= */

footer {

    padding: 35px 7%;

    border-top: 1px solid #e5e7eb;

    text-align: center;

    color: #667085;

    font-size: 14px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .navbar {

        height: 64px;

        padding: 0 5%;
    }

    .auth-section {

        padding: 60px 5%;
    }

    .auth-card {

        padding: 24px;
    }

}

</style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <a href="index.html" class="brand">

        <span class="logo">
            N
        </span>

        <span>
            NorthEast News
        </span>

    </a>

</header>



<!-- =========================
     AUTH
========================= -->

<main class="auth-section">

    <div class="auth-container">

        <p class="eyebrow">
            NORTH EAST COMMUNITY
        </p>

        <h1 id="authTitle">
            Welcome back.
        </h1>

        <p
            class="description"
            id="authDescription"
        >
            Sign in to continue to the NorthEast News feed.
        </p>


        <div class="auth-card">


            <!-- =========================
                 TABS
            ========================= -->

            <div class="auth-tabs">

                <button
                    class="auth-tab active"
                    id="loginTab"
                    type="button"
                >
                    Sign In
                </button>

                <button
                    class="auth-tab"
                    id="signupTab"
                    type="button"
                >
                    Sign Up
                </button>

            </div>



            <!-- =========================
                 LOGIN FORM
            ========================= -->

            <form id="loginForm">

                <div class="form-group">

                    <label for="loginEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                    id="loginBtn"
                >
                    Sign In
                </button>

            </form>



            <!-- =========================
                 SIGN UP FORM
            ========================= -->

            <form
                id="signupForm"
                style="display: none;"
            >

                <div class="form-group">

                    <label for="signupEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Enter password again"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-btn"
                    id="signupBtn"
                >
                    Create Account
                </button>

            </form>


            <p
                id="status"
                class="status"
            ></p>

        </div>

    </div>

</main>



<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        ©
        <span id="year"></span>
        NorthEast News.
        All rights reserved.
    </p>

</footer>



<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================
   SUPABASE CONFIG
===================================== */

const SUPABASE_URL =
   "https://dwalxoklxkdmpiggdeqy.supabase.co ;"

const SUPABASE_ANON_KEY =
    "YOUR_SUPABASE_ANON_KEY";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
    );


/* =====================================
   ELEMENTS
===================================== */

const loginTab =
    document.getElementById("loginTab");

const signupTab =
    document.getElementById("signupTab");

const loginForm =
    document.getElementById("loginForm");

const signupForm =
    document.getElementById("signupForm");

const authTitle =
    document.getElementById("authTitle");

const authDescription =
    document.getElementById("authDescription");

const status =
    document.getElementById("status");


/* =====================================
   FOOTER YEAR
===================================== */

document.getElementById("year").textContent =
    new Date().getFullYear();


/* =====================================
   CLEAR STATUS
===================================== */

function clearStatus() {

    status.textContent = "";

    status.className = "status";

}


/* =====================================
   SHOW LOGIN
===================================== */

loginTab.addEventListener("click", function() {

    loginTab.classList.add("active");

    signupTab.classList.remove("active");

    loginForm.style.display = "block";

    signupForm.style.display = "none";

    authTitle.textContent =
        "Welcome back.";

    authDescription.textContent =
        "Sign in to continue to the NorthEast News feed.";

    clearStatus();

});


/* =====================================
   SHOW SIGN UP
===================================== */

signupTab.addEventListener("click", function() {

    signupTab.classList.add("active");

    loginTab.classList.remove("active");

    signupForm.style.display = "block";

    loginForm.style.display = "none";

    authTitle.textContent =
        "Join us.";

    authDescription.textContent =
        "Create an account to join the NorthEast News community.";

    clearStatus();

});


/* =====================================
   SIGN IN
===================================== */

loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        clearStatus();


        const email =
            document.getElementById(
                "loginEmail"
            ).value.trim();

        const password =
            document.getElementById(
                "loginPassword"
            ).value;


        const loginBtn =
            document.getElementById(
                "loginBtn"
            );


        loginBtn.disabled = true;

        loginBtn.textContent =
            "Signing in...";


        try {

            const { data, error } =
                await supabaseClient.auth.signInWithPassword({

                    email: email,

                    password: password

                });


            if (error) {

                throw error;

            }


            window.location.href =
                "feed.html";


        } catch (error) {

            console.error(error);

            status.textContent =
                error.message ||
                "Unable to sign in.";

            status.className =
                "status error";


            loginBtn.disabled = false;

            loginBtn.textContent =
                "Sign In";

        }

    }
);


/* =====================================
   SIGN UP
===================================== */

signupForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        clearStatus();


        const email =
            document.getElementById(
                "signupEmail"
            ).value.trim();

        const password =
            document.getElementById(
                "signupPassword"
            ).value;

        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        const signupBtn =
            document.getElementById(
                "signupBtn"
            );


        /* CHECK PASSWORDS */

        if (password !== confirmPassword) {

            status.textContent =
                "Passwords do not match.";

            status.className =
                "status error";

            return;

        }


        signupBtn.disabled = true;

        signupBtn.textContent =
            "Creating account...";


        try {

            const { data, error } =
                await supabaseClient.auth.signUp({

                    email: email,

                    password: password

                });


            if (error) {

                throw error;

            }


            /*
               Depending on your Supabase
               email confirmation settings,
               the user may need to confirm
               their email before logging in.
            */

            status.textContent =
                "Account created. Check your email if confirmation is required.";

            status.className =
                "status success";


            signupBtn.disabled = false;

            signupBtn.textContent =
                "Create Account";


        } catch (error) {

            console.error(error);

            status.textContent =
                error.message ||
                "Unable to create account.";

            status.className =
                "status error";


            signupBtn.disabled = false;

            signupBtn.textContent =
                "Create Account";

        }

    }
);

</script>


</body>

</html>
